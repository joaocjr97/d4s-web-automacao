name: D4Sign Web Tests (Behave)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags Behave (ex.: @smoke, @critical, @envio). Vazio = todos os cenários"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        env:
          D4S_USERNAME: ${{ secrets.USERNAME }}
          D4S_PASSWORD: ${{ secrets.PASSWORD }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
          CRYPT_KEY: ${{ secrets.CRYPT_KEY }}
          EMAIL_TESTE: ${{ secrets.EMAIL_TESTE }}
        run: |
          cp .env.exemplo .env
          sed -i "s|D4S_USERNAME=.*|D4S_USERNAME=${D4S_USERNAME}|" .env
          sed -i "s|D4S_PASSWORD=.*|D4S_PASSWORD=${D4S_PASSWORD}|" .env
          sed -i "s|TOKEN_API=.*|TOKEN_API=${TOKEN_API}|" .env
          sed -i "s|CRYPT_KEY=.*|CRYPT_KEY=${CRYPT_KEY}|" .env
          sed -i "s|EMAIL_TESTE=.*|EMAIL_TESTE=${EMAIL_TESTE}|" .env
          sed -i "s|HEADLESS=.*|HEADLESS=true|" .env
          sed -i "s|RECORD_VIDEO=.*|RECORD_VIDEO=false|" .env

      - name: List scenarios (dry-run)
        run: |
          echo "=== Cenários planejados ==="
          python -u -m behave features/ --dry-run --format progress
          echo "==========================="

      - name: Run Behave tests
        run: |
          mkdir -p reports
          TAGS="${{ github.event.inputs.tags }}"
          ARGS=(
            python -u -m behave features/
            --no-capture
            --show-timings
            --logging-level INFO
            --format progress
            --format html
            --outfile reports/behave_report.html
          )
          if [ -n "$TAGS" ]; then
            ARGS+=(--tags="$TAGS")
          fi
          echo "=== Início $(date -u +%H:%M:%S) UTC ==="
          echo "Comando: ${ARGS[*]}"
          set -o pipefail
          stdbuf -oL -eL "${ARGS[@]}" 2>&1 | tee reports/behave_console.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Fim $(date -u +%H:%M:%S) UTC | exit=${EXIT_CODE} ==="
          exit "${EXIT_CODE}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-reports
          path: reports/
